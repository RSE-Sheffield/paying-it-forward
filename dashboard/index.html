/* ---------- view: variation ---------- */

/** Per-paper spread of one configuration's repeats. */
function variationOf(configId) {
  const runs = selectedInConfig(configId);
  const rows = DATA.papers.map((p) => {
    const byRun = J_BY_PAPER.get(p.pmid) || new Map();
    const votes = runs.map((r) => ({ run: r, cat: (byRun.get(r.run_id) || {}).category || "" }))
      .filter((v) => v.cat);
    const counts = {};
    for (const v of votes) counts[v.cat] = (counts[v.cat] || 0) + 1;
    const max = votes.length ? Math.max(...Object.values(counts)) : 0;
    const tied = CATS.filter((c) => counts[c] === max && max > 0);
    const modal = tied[0] || null;
    // Modal votes first, then dissent grouped by category — run order is
    // arbitrary, so sorting makes the split readable at a glance.
    const ordered = votes.slice().sort((a, b) =>
      (a.cat === modal ? 0 : 1) - (b.cat === modal ? 0 : 1)
      || CATS.indexOf(a.cat) - CATS.indexOf(b.cat));
    return {
      paper: p, pmid: p.pmid, votes: ordered, counts, modal,
      n: votes.length, agree: max, share: votes.length ? max / votes.length : 0,
      distinct: Object.keys(counts).length, tied: tied.length > 1,
      dissent: ordered.filter((v) => v.cat !== modal),
    };
  }).filter((r) => r.n > 0);
  return { configId, runs, rows };
}

function viewVariation() {
  const configs = activeConfigs();
  if (!configs.length) return el("div", { class: "card empty", text: "No configurations selected — pick at least one above." });

  // Default to the first selected configuration that actually has repeats.
  if (!configs.includes(state.config)) {
    state.config = configs.find((id) => selectedInConfig(id).length > 1) || configs[0];
  }
  const vars = new Map(configs.map((id) => [id, variationOf(id)]));
  const meanShare = (v) => v.rows.length ? v.rows.reduce((a, r) => a + r.share, 0) / v.rows.length : 0;
  const cards = [];

  // --- stability across the configurations in view -------------------------
  const repeated = configs.filter((id) => selectedInConfig(id).length > 1);
  const single = configs.filter((id) => selectedInConfig(id).length === 1);
  if (repeated.length > 1) {
    const bars = repeated.map((id) => ({
      label: configLabel(id), value: meanShare(vars.get(id)), color: configColor(id),
      tipTitle: `${configLabel(id)} — ${vars.get(id).runs.length} runs`,
    }));
    cards.push(chartCard("var-stability", "How steady is each configuration?",
      "Mean share of a configuration's repeats landing on that paper's most-chosen category, averaged over every paper. 100% means every repeat agreed every time."
      + (single.length ? ` Left out: ${single.map(configLabel).join(", ")} — a single run has nothing to vary against.` : ""),
      () => el("div", { style: "--rl-w:220px" }, simpleBars(bars, { format: (x) => pct(x), unit: "mean agreement", max: 1 })),
      () => table([{ label: "Configuration" }, { label: "Runs", num: true }, { label: "Mean agreement", num: true },
                   { label: "Unanimous papers", num: true }, { label: "Papers with dissent", num: true }],
        configs.map((id) => {
          const v = vars.get(id);
          const unan = v.rows.filter((r) => r.distinct === 1).length;
          return [configLabel(id), numCell(v.runs.length), numCell(pct(meanShare(v))),
                  numCell(`${unan}/${v.rows.length}`), numCell(v.rows.length - unan)];
        }))));
  }

  // --- configuration picker -------------------------------------------------
  cards.push(el("div", { class: "card" }, [
    el("h2", { text: "Look inside one configuration" }),
    el("div", { class: "card-note", text: "Pick the configuration to break down paper by paper." }),
    el("div", { class: "chips" }, configs.map((id) => el("button", {
      class: `chip c${configSlot(id)}`, type: "button",
      "aria-pressed": String(state.config === id),
      onclick: () => { state.config = id; render(); },
      text: `${configLabel(id)} · ${selectedInConfig(id).length} run${selectedInConfig(id).length === 1 ? "" : "s"}`,
    }))),
  ]));

  const v = vars.get(state.config);
  const color = configColor(state.config);
  const n = v.runs.length;

  if (n < 2) {
    cards.push(el("div", { class: "card empty",
      text: `${configLabel(state.config)} has a single run in view, so there is no repeat-to-repeat variation to show. Pick a configuration with repeats, or re-add its runs on the Runs tab.` }));
    return el("div", {}, cards);
  }

  const unanimous = v.rows.filter((r) => r.distinct === 1);
  const split = v.rows.filter((r) => r.distinct > 1);

  cards.push(el("div", { class: "tiles" }, [
    tile("Mean agreement", pct(meanShare(v)), `across ${v.rows.length} papers, ${n} runs each`),
    tile("Unanimous", String(unanimous.length), `of ${v.rows.length} papers — all ${n} runs agreed`),
    tile("Split", String(split.length), "papers where the repeats disagreed"),
    tile("No majority", String(v.rows.filter((r) => r.tied).length), "papers where the top category tied"),
    tile("Widest spread", String(Math.max(...v.rows.map((r) => r.distinct))), "distinct categories on one paper"),
  ]));

  // --- how often do k of n runs agree? -------------------------------------
  const levels = [];
  for (let k = n; k >= 1; k--) {
    const papers = v.rows.filter((r) => r.agree === k);
    if (!papers.length && k * 3 < n) continue;
    levels.push({ label: `${k} of ${n}`, value: papers.length, color, tipTitle: `${k} of ${n} runs agreed` });
  }
  cards.push(chartCard("var-levels", "How often do the repeats agree?",
    `Papers grouped by how many of the ${n} runs landed on the same category. ${n} of ${n} is unanimous.`,
    () => simpleBars(levels, { color, unit: "papers", format: (x) => `${x} paper${x === 1 ? "" : "s"}` }),
    () => table([{ label: "Runs agreeing" }, { label: "Papers", num: true }, { label: "Share of papers", num: true }],
      levels.map((l) => [l.label, numCell(l.value), numCell(pct(l.value / v.rows.length))]))));

  // --- paper by paper -------------------------------------------------------
  const sorted = v.rows.slice().sort((a, b) =>
    state.varSort === "paper"
      ? (a.paper.title || "").localeCompare(b.paper.title || "")
      : a.share - b.share || b.distinct - a.distinct);
  cards.push(el("div", { class: "card" }, [
    el("div", { class: "card-head" }, [
      el("h2", { text: `Every paper, every repeat — ${configLabel(state.config)}` }),
      el("button", { class: "btn", type: "button",
        onclick: () => { state.varSort = state.varSort === "paper" ? "spread" : "paper"; render(); },
        text: state.varSort === "paper" ? "Sort by spread" : "Sort by title" }),
    ]),
    el("div", { class: "card-note", text:
      "One cell per run. Coloured cells chose the majority category; grey cells are dissenting runs, each labelled with what it chose instead. Click a row to read the reasoning behind every vote." }),
    el("div", {}, sorted.map((r) => variationRow(r, color))),
  ]));

  // --- where the dissent lands ---------------------------------------------
  const dissentCount = (modal, other) =>
    v.rows.filter((r) => r.modal === modal)
      .reduce((a, r) => a + r.dissent.filter((d) => d.cat === other).length, 0);
  if (CATS.some((m) => CATS.some((o) => dissentCount(m, o) > 0))) {
    cards.push(chartCard("var-drift", "Where does it waver?",
      "Rows are the majority category for a paper, columns what the dissenting runs chose instead. A column that keeps filling up means this configuration slides the same way whenever it wavers.",
      () => driftMatrix(dissentCount),
      () => table([{ label: "Majority / dissent" }, ...CATS.map((c) => ({ label: c, num: true })), { label: "Total", num: true }],
        CATS.map((m) => [m, ...CATS.map((o) => numCell(dissentCount(m, o))),
          numCell(CATS.reduce((a, o) => a + dissentCount(m, o), 0))]))));
  }

  return el("div", {}, cards);
}

/** One paper: a cell per run, majority first, each labelled with its category. */
function variationRow(r, color) {
  const key = "var:" + state.config + ":" + r.pmid;
  const open = state.openReasons.has(key);
  const cells = r.votes.map((vote) => {
    const isModal = vote.cat === r.modal;
    return hoverable(el("span", {
      class: "vote-cell" + (isModal ? " modal" : ""), tabindex: "0",
      style: isModal ? `background:${color}` : null, text: vote.cat,
    }), () => [
      el("div", { class: "tl", text: vote.run.run_id }),
      tipLine(isModal ? "majority category" : "dissenting vote", vote.cat, isModal ? color : "var(--baseline)"),
    ]);
  });
  const head = el("button", { class: "jhead", type: "button", "aria-expanded": String(open), onclick: () => {
    open ? state.openReasons.delete(key) : state.openReasons.add(key);
    render();
  }}, [
    el("span", { class: "caret", text: open ? "▾" : "▸" }),
    el("span", { class: "num", style: "min-width:40px; font-weight:600", text: `${r.agree}/${r.n}` }),
    el("span", { class: "vote-strip" }, cells),
    el("span", { class: "snip", style: "color:var(--text-primary); white-space:normal", text: r.paper.title || r.pmid }),
    r.tied ? el("span", { class: "code tied", title: "no single majority", text: "tie" }) : null,
  ]);
  const kids = [head];
  if (open) {
    kids.push(el("div", { style: "padding: 4px 0 12px 22px" }, [
      el("div", { class: "card-note", style: "margin-bottom:6px",
        text: `${r.paper.field || ""} · ${r.paper.year || ""} · ${r.distinct} distinct categor${r.distinct === 1 ? "y" : "ies"} across ${r.n} runs` }),
      el("div", {}, r.votes.map((vote) =>
        judgementRow(r.pmid, vote.run, J_BY_PAPER.get(r.pmid).get(vote.run.run_id)))),
      el("button", { class: "btn", type: "button", style: "margin-top:8px",
        onclick: () => { state.paper = r.pmid; state.tab = "papers"; render(); },
        text: "See every configuration on this paper →" }),
    ]));
  }
  return el("div", { class: "jrow" }, kids);
}

/** Human category (rows) x what the model runs chose (columns), row-normalised
    so each row reads as "when the human said X, the models said ...". */
function substitutionMatrix(used, grid, rowTotal) {
  const cells = [el("div", { class: "hd" })];
  for (const m of CATS) cells.push(el("div", { class: "hd", text: m }));
  for (const h of used) {
    const n = rowTotal(h);
    cells.push(el("div", { class: "hd rowhd", text: h }));
    for (const m of CATS) {
      const v = grid[h][m], share = n ? v / n : 0;
      const step = v === 0 ? -1 : Math.min(6, Math.round(share * 6));
      const bg = step < 0 ? "var(--surface-2)" : `var(--ramp-${step})`;
      const ink = step < 0 ? "var(--text-muted)" : `var(--ramp-ink-${step >= 5 ? "hi" : "lo"})`;
      const cell = el("div", {
        class: "cell", tabindex: "0",
        style: `background:${bg}; color:${ink}; min-width:40px; height:32px; font-size:11px`
          + (h === m ? "; outline:2px solid var(--good); outline-offset:-2px" : ""),
      }, el("span", { class: "num", text: v ? pct(share) : "" }));
      cells.push(hoverable(cell, () => [
        el("div", { class: "tl", text: `human ${h} → models said ${m}` }),
        tipLine("of model runs", pct(share)),
        el("div", { class: "tl", text: `${v} of ${n} runs` }),
      ]));
    }
  }
  return el("div", {}, [
    el("div", { class: "scroll-x" }, matrixFrame(
      el("div", { class: "matrix", style: "grid-template-columns: max-content repeat(9, 1fr)" }, cells),
      "the model runs chose →", "← human said")),
    el("div", { class: "ramp-legend" }, [
      el("span", { class: "sw", style: "background:var(--surface-2)" }), "0%",
      ...[0, 1, 2, 3, 4, 5, 6].map((i) => el("span", { class: "sw", style: `background:var(--ramp-${i})` })),
      "100%", el("span", { class: "muted", text: "of that row's model runs · green outline = agreement" }),
    ]),
  ]);
}

/** One axis of the taxonomy on its own: human level (rows) x model level
    (columns), each row normalised to 100%. */
function axisMatrix(x) {
  const cells = [el("div", { class: "hd" })];
  for (const m of x.levels) cells.push(el("div", { class: "hd", text: `${m} · ${shortTax(m)}` }));
  for (const h of x.levels) {
    const n = x.levels.reduce((a, m) => a + x.g[h][m], 0);
    cells.push(el("div", { class: "hd rowhd", text: `${h} · ${shortTax(h)}` }));
    for (const m of x.levels) {
      const v = x.g[h][m], share = n ? v / n : 0;
      const step = v === 0 ? -1 : Math.min(6, Math.round(share * 6));
      const bg = step < 0 ? "var(--surface-2)" : `var(--ramp-${step})`;
      const ink = step < 0 ? "var(--text-muted)" : `var(--ramp-ink-${step >= 5 ? "hi" : "lo"})`;
      const cell = el("div", {
        class: "cell", tabindex: "0",
        style: `background:${bg}; color:${ink}; height:46px`
          + (h === m ? "; outline:2px solid var(--good); outline-offset:-2px" : ""),
      }, [
        el("span", { class: "num", text: n ? pct(share) : "" }),
        el("span", { class: "pct num", text: String(v) }),
      ]);
      cells.push(hoverable(cell, () => [
        el("div", { class: "tl", text: `human ${h} (${DATA.taxonomy[h].label}) → model ${m}` }),
        tipLine("of that row", n ? pct(share) : "—"),
        el("div", { class: "tl", text: `${v} of ${n} judgements` }),
      ]));
    }
  }
  return el("div", { class: "matrix", style: "grid-template-columns: max-content repeat(3, 1fr)" }, cells);
}

/** 9x9 majority-vs-dissent heatmap; the diagonal is empty by construction. */
function driftMatrix(cellCount) {
  const vals = [];
  for (const m of CATS) for (const o of CATS) vals.push(cellCount(m, o));
  const max = Math.max(1, ...vals);
  const cells = [el("div", { class: "hd" })];
  for (const o of CATS) cells.push(el("div", { class: "hd", text: o }));
  for (const m of CATS) {
    cells.push(el("div", { class: "hd rowhd", text: m }));
    for (const o of CATS) {
      const val = cellCount(m, o);
      const step = val === 0 ? -1 : Math.min(6, Math.round((val / max) * 6));
      const bg = step < 0 ? "var(--surface-2)" : `var(--ramp-${step})`;
      const ink = step < 0 ? "var(--text-muted)" : `var(--ramp-ink-${step >= 5 ? "hi" : "lo"})`;
      const cell = el("div", {
        class: "cell", tabindex: "0",
        style: `background:${bg}; color:${ink}; min-width:34px; height:30px; font-size:12px`
          + (m === o ? "; opacity:0.35" : ""),
      }, el("span", { class: "num", text: val ? String(val) : "" }));
      cells.push(hoverable(cell, () => [
        el("div", { class: "tl", text: `majority ${m} · dissent chose ${o}` }),
        tipLine("dissenting votes", String(val)),
      ]));
    }
  }
  return el("div", {}, [
    el("div", { class: "scroll-x" }, matrixFrame(
      el("div", { class: "matrix small", style: "grid-template-columns: max-content repeat(9, 1fr)" }, cells),
      "the dissenting runs chose →", "← majority category"),),
    el("div", { class: "ramp-legend" }, [
      el("span", { class: "sw", style: "background:var(--surface-2)" }), "0",
      ...[0, 1, 2, 3, 4, 5, 6].map((i) => el("span", { class: "sw", style: `background:var(--ramp-${i})` })),
      String(max), el("span", { class: "muted", text: "dissenting votes" }),
    ]),
  ]);
}

/* ---------- view: consensus ---------- */
function viewConsensus() {
  const arms = activeConfigs();
  const modelArms = arms.filter((a) => !isHuman(a));
  if (!arms.length) return el("div", { class: "card empty", text: "No configurations selected — pick at least one above." });
  const hasHuman = !!HUMAN_ID && arms.includes(HUMAN_ID);

  const summaries = arms.map((a) => configSummary(a, hasHuman && !isHuman(a) ? HUMAN_ID : null));
  const byArm = new Map(summaries.map((s) => [s.config, s]));

  const head = el("div", { class: "card" }, [
    el("h2", { text: "Reduce the repeats, then compare" }),
    el("div", { class: "card-note", text: "Each configuration's repeated runs collapse to the category chosen most often per paper. Ties are marked with * and resolved in taxonomy order for the comparison." }),
    el("div", { class: "scroll-x" }, el("table", {}, [
      el("thead", {}, el("tr", {}, [
        el("th", { text: "Configuration" }), el("th", { class: "num", text: "Runs" }),
        el("th", { class: "num", text: "Unanimous" }),
        el("th", { class: "num", text: "Exact" }), el("th", { class: "num", text: "S axis" }),
        el("th", { class: "num", text: "D axis" }),
      ])),
      el("tbody", {}, summaries.map((s) => el("tr", {}, [
        el("td", {}, el("span", { style: "display:inline-flex; align-items:center; gap:7px" }, [
          el("span", { class: "swatch", style: `background:${configColor(s.config)}` }), configLabel(s.config)])),
        el("td", { class: "num", text: String(s.runs.length) }),
        el("td", { class: "num", text: s.runs.length > 1 ? `${s.unanimous}/${s.nPapers}` : "—" }),
        el("td", { class: "num", text: s.exact === null ? "—" : `${pct(s.exact)} (${s.exactN}/${s.scoredN})` }),
        el("td", { class: "num", text: s.sAgree === null ? "—" : pct(s.sAgree) }),
        el("td", { class: "num", text: s.dAgree === null ? "—" : pct(s.dAgree) }),
      ]))),
    ])),
    el("div", { class: "card-note", style: "margin:10px 0 0",
      text: "Unanimous counts the papers where every repeat picked the same category. "
        + "Exact, S axis and D axis are agreement with the human: the whole category, and each axis on its own." }),
  ]);

  const cards = [];

  if (hasHuman && modelArms.length) {
    const counter = (a) => {
      const s = byArm.get(a);
      return (modelCat, humanCat) =>
        s.rows.filter((r) => r.cons.category === modelCat && r.ref && r.ref.category === humanCat).length;
    };
    const sharedMax = Math.max(1, ...modelArms.flatMap((a) => {
      const f = counter(a);
      return CATS.flatMap((mc) => CATS.map((hc) => f(mc, hc)));
    }));
    cards.push(chartCard("cm-all", "Where each configuration lands against the human",
      "One panel per configuration. Rows (left) are the human's category, columns (top) are the configuration's most-chosen one — the same way round as the substitution matrix below. The green outline marks the diagonal where they agree, so anything off it is a disagreement. All panels share one colour scale.",
      () => el("div", {}, [
        matrixFrame(el("div", { class: "panel-grid" }, modelArms.map((a) => {
          const s = byArm.get(a);
          return el("div", { class: "panel" }, [
            el("div", { class: "panel-cap" }, [
              el("span", { class: "rect", style: `background:${configColor(a)}` }),
              el("span", { style: "min-width:0" }, [
                el("span", { class: "nm", text: configLabel(a) }),
                el("span", { class: "sub", text: s.exact === null ? "" : `${s.exactN}/${s.scoredN} papers agree` }),
              ]),
            ]),
            confusionMatrix(s, counter(a), { compact: true, noLegend: true, noAxis: true, max: sharedMax }),
          ]);
        })), "each configuration chose →", "← human said"),
        el("div", { style: "margin-top:12px; border-top:1px solid var(--grid); padding-top:10px" },
          rampLegend(sharedMax, "papers — one scale shared by every panel · green outline = agreement")),
      ]),
      () => el("div", {}, modelArms.map((a) => {
        const f = counter(a), s = byArm.get(a);
        return el("div", { style: "margin-bottom:18px" }, [
          el("h3", { style: "margin-bottom:6px", text: configLabel(a) }),
          table([{ label: "Human / model" }, ...CATS.map((c) => ({ label: c, num: true })), { label: "Total", num: true }],
            CATS.map((hc) => [hc, ...CATS.map((mc) => numCell(f(mc, hc))),
              numCell(s.rows.filter((r) => r.ref && r.ref.category === hc).length)])),
        ]);
      }))));
  }

  // How the model runs respond to each call the human actually made. Pooled
  // across every selected model run, so this is run-level, not consensus-level.
  let swapCard = null;
  if (hasHuman && modelArms.length) {
    const modelRuns = selectedRuns().filter((r) => !isHuman(r.config));
    const grid = Object.fromEntries(CATS.map((h) => [h, Object.fromEntries(CATS.map((m) => [m, 0]))]));
    for (const p of DATA.papers) {
      const human = consensus(p.pmid, selectedInConfig(HUMAN_ID)).category;
      if (!human) continue;
      const byRun = J_BY_PAPER.get(p.pmid) || new Map();
      for (const r of modelRuns) {
        const c = (byRun.get(r.run_id) || {}).category;
        if (c) grid[human][c]++;
      }
    }
    const rowTotal = (h) => CATS.reduce((a, m) => a + grid[h][m], 0);
    const used = CATS.filter((h) => rowTotal(h) > 0);
    if (used.length) {
      swapCard = chartCard("agree-swap", "What the models pick instead",
        "Each row is a category the human used, read across as the share of model runs landing in each category. "
        + "The green outline is the diagonal, where the models matched; everything else in that row is what they chose instead.",
        () => substitutionMatrix(used, grid, rowTotal),
        () => table(
          [{ label: "Human said" }, ...CATS.map((c) => ({ label: c, num: true })), { label: "Runs", num: true }],
          used.map((h) => [h, ...CATS.map((m) => numCell(grid[h][m] || "—")), numCell(rowTotal(h))])));
    }
  }

  // The same pooled judgements, split into the two axes the taxonomy is built
  // from. A category can be wrong on software, on data, or on both, and the
  // two axes fail in different directions — which the 9x9 view above hides.
  let axisCard = null;
  if (hasHuman && modelArms.length) {
    const modelRuns = selectedRuns().filter((r) => !isHuman(r.config));
    const AXES = [
      { key: "S", levels: S_AXIS, from: 0, to: 2, label: "Software axis" },
      { key: "D", levels: D_AXIS, from: 2, to: 4, label: "Data axis" },
    ];
    const grids = AXES.map((ax) => ({
      ...ax,
      g: Object.fromEntries(ax.levels.map((a) => [a, Object.fromEntries(ax.levels.map((b) => [b, 0]))])),
    }));
    let judged = 0, disagree = 0, both = 0;
    for (const pa of DATA.papers) {
      const h = consensus(pa.pmid, selectedInConfig(HUMAN_ID)).category;
      if (!h) continue;
      const byRun = J_BY_PAPER.get(pa.pmid) || new Map();
      for (const r of modelRuns) {
        const c = (byRun.get(r.run_id) || {}).category;
        if (!c) continue;
        judged++;
        for (const x of grids) x.g[h.slice(x.from, x.to)][c.slice(x.from, x.to)]++;
        const sDiff = h.slice(0, 2) !== c.slice(0, 2);
        const dDiff = h.slice(2, 4) !== c.slice(2, 4);
        if (sDiff || dDiff) disagree++;
        if (sDiff && dDiff) both++;
      }
    }
    const wrong = (x) => x.levels.reduce((a, h) =>
      a + x.levels.reduce((b, m) => b + (h === m ? 0 : x.g[h][m]), 0), 0);

    if (judged) {
      axisCard = chartCard("axis-conf", "Each axis on its own",
        `Every model judgement scored against the human on one axis at a time — ${fmtNum(judged)} judgements. `
        + "Rows are the human's level, columns the model's, and each row is normalised to 100% so it reads as "
        + `"when the human said this, the models said that". Of ${disagree} disagreeing judgements, `
        + `${disagree - both} (${pct(disagree ? (disagree - both) / disagree : 0)}) are wrong on one axis only — `
        + "the model usually has half the answer right.",
        () => el("div", {}, [
          matrixFrame(el("div", { class: "panel-grid", style: "grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))" },
            grids.map((x) => el("div", { class: "panel" }, [
              el("div", { class: "panel-cap" }, [
                el("span", { class: "rect", style: "background:var(--series-1)" }),
                el("span", { style: "min-width:0" }, [
                  el("span", { class: "nm", text: x.label }),
                  el("span", { class: "sub", text: `${wrong(x)} of ${fmtNum(judged)} disagree` }),
                ]),
              ]),
              axisMatrix(x),
            ]))), "the model runs chose →", "← human said"),
          el("div", { class: "ramp-legend" }, [
            el("span", { class: "sw", style: "background:var(--surface-2)" }), "0%",
            ...[0, 1, 2, 3, 4, 5, 6].map((i) => el("span", { class: "sw", style: `background:var(--ramp-${i})` })),
            "100%", el("span", { class: "muted", text: "of that row · green outline = agreement" }),
          ]),
        ]),
        () => el("div", {}, grids.map((x) => el("div", { style: "margin-bottom:18px" }, [
          el("h3", { style: "margin-bottom:6px", text: x.label }),
          table([{ label: "Human said" }, ...x.levels.map((l) => ({ label: l, num: true })), { label: "Runs", num: true }],
            x.levels.map((h) => {
              const n = x.levels.reduce((a, m) => a + x.g[h][m], 0);
              return [`${h} · ${DATA.taxonomy[h].label}`,
                ...x.levels.map((m) => numCell(n ? `${pct(x.g[h][m] / n)} (${x.g[h][m]})` : "—")),
                numCell(n)];
            })),
        ]))));
    }
  }

  // Summary and substitution share the top row; the axis split and the
  // per-configuration panels follow.
  cards.unshift(el("div", { class: "card-row" }, swapCard ? [head, swapCard] : [head]));
  if (axisCard) cards.splice(1, 0, axisCard);

  // Leaderboard: every model run scored against the human's call for that paper.
  if (hasHuman && modelArms.length) {
    const modelRuns = selectedRuns().filter((r) => !isHuman(r.config));
    const board = DATA.papers.map((p) => {
      const byRun = J_BY_PAPER.get(p.pmid) || new Map();
      const human = consensus(p.pmid, selectedInConfig(HUMAN_ID)).category;
      const perConfig = modelArms.map((a) => {
        const runs = selectedInConfig(a);
        const votes = runs.map((r) => (byRun.get(r.run_id) || {}).category || "").filter(Boolean);
        const agree = human ? votes.filter((c) => c === human).length : 0;
        const other = {};
        for (const c of votes) if (c !== human) other[c] = (other[c] || 0) + 1;
        return { id: a, runs: runs.length, votes: votes.length, agree, other };
      });
      const agree = perConfig.reduce((x, c) => x + c.agree, 0);
      const scored = perConfig.reduce((x, c) => x + c.votes, 0);
      return { paper: p, pmid: p.pmid, human, perConfig, agree, scored,
               share: scored ? agree / scored : 0 };
    }).filter((r) => r.human && r.scored);

    const ranked = board.slice().sort((a, b) =>
      state.boardSort === "worst"
        ? a.agree - b.agree || (a.paper.title || "").localeCompare(b.paper.title || "")
        : b.agree - a.agree || (a.paper.title || "").localeCompare(b.paper.title || ""));
    const total = modelRuns.length;
    const perfect = board.filter((r) => r.agree === r.scored).length;
    const zero = board.filter((r) => r.agree === 0).length;
    const mean = board.length ? board.reduce((x, r) => x + r.share, 0) / board.length : 0;

    const lbCard = el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [
        el("h2", { text: "Leaderboard — papers by agreement with the human" }),
        el("button", { class: "btn", type: "button",
          onclick: () => { state.boardSort = state.boardSort === "worst" ? "best" : "worst"; render(); },
          text: state.boardSort === "worst" ? "Most agreed first" : "Least agreed first" }),
      ]),
      el("div", { class: "card-note", text:
        `Every model run scored against the human's category for that paper — ${total} runs across `
        + `${modelArms.length} configuration${modelArms.length === 1 ? "" : "s"}. `
        + "The bar shows which configurations agreed. Click a row for the breakdown." }),
      el("div", { class: "tiles", style: "margin-bottom:14px" }, [
        tile("Mean agreement", pct(mean), `across ${board.length} papers`),
        tile("Full house", String(perfect), `papers where all ${total} runs matched the human`),
        tile("Nobody agreed", String(zero), "papers where no run matched the human"),
      ]),
      el("div", {}, ranked.map((r, i) => leaderboardRow(r, i + 1, total))),
    ]);
    if (!board.length) {
      clear(lbCard).appendChild(el("div", { class: "empty", text: "The human pass has no category recorded for any paper in view." }));
    }
    cards.push(lbCard);
  }

  return el("div", {}, cards);
}

/** One paper on the leaderboard, expandable to the per-configuration split. */
function leaderboardRow(r, rank, total) {
  const key = "lb:" + r.pmid;
  const open = state.openReasons.has(key);
  const segs = r.perConfig.filter((c) => c.agree > 0).map((c) =>
    hoverable(el("span", { tabindex: "0", class: "lb-seg",
      style: `width:${(c.agree / Math.max(1, total)) * 100}%; background:${configColor(c.id)}` }), () => [
      el("div", { class: "tl", text: r.paper.title || r.pmid }),
      tipLine(`${configLabel(c.id)} runs matching ${r.human}`, `${c.agree}/${c.votes}`, configColor(c.id)),
    ]));
  const head = el("button", { class: "jhead", type: "button", "aria-expanded": String(open), onclick: () => {
    open ? state.openReasons.delete(key) : state.openReasons.add(key);
    render();
  }}, [
    el("span", { class: "caret", text: open ? "▾" : "▸" }),
    el("span", { class: "lb-rank num", text: `${rank}` }),
    el("span", { class: "lb-score num", text: `${r.agree}/${r.scored}` }),
    el("span", { class: "lb-bar" }, segs),
    codePill(r.human, { title: `human: ${categoryTitle(r.human)}` }),
    el("span", { class: "snip", style: "color:var(--text-primary); white-space:normal", text: r.paper.title || r.pmid }),
  ]);
  const kids = [head];
  if (open) {
    kids.push(el("div", { style: "padding: 4px 0 14px 22px" }, [
      el("div", { class: "card-note", style: "margin-bottom:8px" }, [
        el("span", { text: `${r.paper.field || ""} · ${r.paper.year || ""} · the human called this ` }),
        el("b", { text: r.human }),
        el("span", { text: ` — ${categoryTitle(r.human)}` }),
      ]),
      table(
        [{ label: "Configuration" }, { label: "Agreed", num: true }, { label: "What the rest said" }],
        r.perConfig.map((c) => [
          nodeCell(el("span", { style: "display:inline-flex; align-items:center; gap:7px" }, [
            el("span", { class: "swatch", style: `background:${configColor(c.id)}` }), configLabel(c.id)])),
          nodeCell(el("span", { class: "match " + (c.agree === c.votes ? "yes" : c.agree ? "part" : "no") },
            [el("span", { class: "dot" }), `${c.agree}/${c.votes}`]), true),
          nodeCell(el("span", { style: "display:inline-flex; gap:6px; flex-wrap:wrap" },
            Object.keys(c.other).length
              ? Object.keys(c.other).sort((x, y) => CATS.indexOf(x) - CATS.indexOf(y)).map((cat) =>
                  el("span", { class: "code", title: axisMatch(cat, r.human, 0) ? "software axis matches"
                    : axisMatch(cat, r.human, 1) ? "data axis matches" : categoryTitle(cat),
                    text: `${cat} ×${c.other[cat]}` }))
              : [el("span", { class: "muted", text: "—" })])),
        ])),
      el("button", { class: "btn", type: "button", style: "margin-top:10px",
        onclick: () => { state.paper = r.pmid; state.tab = "papers"; render(); },
        text: "Read every judgement on this paper →" }),
    ]));
  }
  return el("div", { class: "jrow" }, kids);
}

function confusionMatrix(s, cellCount, opts) {
  opts = opts || {};
  const counts = [];
  for (const mc of CATS) for (const hc of CATS) counts.push(cellCount(mc, hc));
  // Panels shown side by side are read against each other, so the caller
  // pins one scale across the set.
  const max = Math.max(1, opts.max || 0, ...(opts.max ? [] : counts));
  const cells = [el("div", { class: "hd" })];
  for (const mc of CATS) cells.push(el("div", { class: "hd", text: mc }));
  for (const hc of CATS) {
    cells.push(el("div", { class: "hd rowhd", text: hc }));
    for (const mc of CATS) {
      const v = cellCount(mc, hc);
      const step = v === 0 ? -1 : Math.min(6, Math.round((v / max) * 6));
      const diag = mc === hc;
      const bg = step < 0 ? "var(--surface-2)" : `var(--ramp-${step})`;
      const ink = step < 0 ? "var(--text-muted)" : `var(--ramp-ink-${step >= 5 ? "hi" : "lo"})`;
      const cell = el("div", {
        class: "cell", tabindex: "0",
        style: `background:${bg}; color:${ink}`
          + (opts.compact ? "" : "; min-width:34px; height:30px; font-size:12px")
          + (diag ? "; outline:2px solid var(--good); outline-offset:-2px" : ""),
      }, el("span", { class: "num", text: v ? String(v) : "" }));
      cells.push(hoverable(cell, () => [
        el("div", { class: "tl", text: `human ${hc} → model ${mc}` }),
        tipLine(diag ? "papers agreed" : "papers", String(v)),
      ]));
    }
  }
  const bare = el("div", { class: `matrix ${opts.compact ? "tiny" : "small"}`,
    style: "grid-template-columns: max-content repeat(9, 1fr)" }, cells);
  if (opts.noAxis) return bare;
  const framed = matrixFrame(bare, "this configuration chose →", "← human said", opts.compact);
  if (opts.noLegend) return framed;
  return el("div", {}, [
    el("div", { class: "scroll-x" }, framed),
    rampLegend(max, "papers · green outline = agreement"),
  ]);
}

/* ---------- view: reasoning ---------- */

/** A short label naming who wrote the commentary that follows. */
function commentary(kids) {
  return el("div", { class: "commentary" }, [
    el("div", { class: "who" }, [
      el("span", { class: "who-badge", text: "AI" }),
      el("span", { text: "Claude's reading — an interpretation of the text below, not a measurement" }),
    ]),
    ...[].concat(kids),
  ]);
}
const para = (text) => el("p", { class: "prose", text });

/** Papers where the human's category is one no model run picked. */
function zeroAgreementCases() {
  const humanRuns = selectedInConfig(HUMAN_ID);
  const modelRuns = selectedRuns().filter((r) => !isHuman(r.config));
  return DATA.papers.map((p) => {
    const human = consensus(p.pmid, humanRuns).category;
    const byRun = J_BY_PAPER.get(p.pmid) || new Map();
    const votes = modelRuns.map((r) => ({ run: r, cat: (byRun.get(r.run_id) || {}).category }))
      .filter((v) => v.cat);
    const counts = {};
    for (const v of votes) counts[v.cat] = (counts[v.cat] || 0) + 1;
    const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || CATS.indexOf(a) - CATS.indexOf(b));
    return {
      paper: p, human, votes, counts, ranked,
      humanRun: humanRuns[0] || null,
      agree: human ? votes.filter((v) => v.cat === human).length : 0,
    };
  }).filter((c) => c.human && c.votes.length && c.agree === 0)
    .sort((a, b) => (b.counts[b.ranked[0]] || 0) - (a.counts[a.ranked[0]] || 0));
}

function viewReasoning() {
  const configs = activeConfigs();
  if (!configs.length) return el("div", { class: "card empty", text: "No configurations selected — pick at least one above." });
  if (!HUMAN_ID || !selectedInConfig(HUMAN_ID).length) {
    return el("div", { class: "card empty", text: "This tab compares model reasoning against the human's, so the human pass needs to be in view." });
  }

  const cases = zeroAgreementCases();
  const cards = [];

  cards.push(el("div", { class: "card banner" }, [
    el("h2", { text: "How to read this tab" }),
    el("div", { class: "prose" }, [
      el("p", { class: "prose", text:
        "Every quote on this tab is the free-text justification a run recorded in Experiments/, shown verbatim. "
        + "The commentary between the quotes — what the disagreement is about, and what rule each side seems to be "
        + "applying — was written by Claude reading those justifications." }),
      el("p", { class: "prose", text:
        "That commentary is an interpretation of unstructured text by a language model, not a measurement. "
        + "It is the one thing on this dashboard that is not derived arithmetically from the run files, so treat it "
        + "as a reviewer's note and check it against the quotes underneath it, which are the evidence." }),
    ]),
  ]));

  const caseCard = el("div", { class: "card" }, [
    el("h2", { text: "What is actually being argued about — case by case" }),
    el("div", { class: "card-note", text:
      `The ${cases.length} paper${cases.length === 1 ? "" : "s"} where not one model run reached the human's category. `
      + "These are the clearest read on what the disagreement is, because there is no partial agreement to explain away." }),
  ]);

  if (!cases.length) {
    caseCard.appendChild(el("div", { class: "empty", text: "Every paper in view has at least one model run agreeing with the human." }));
  } else {
    caseCard.appendChild(commentary([
      para("Reading the justifications for these papers, nearly all of the conflict is one question: does research "
        + "code count as generated software? The human counts a usable artefact coming out of the study, however "
        + "small. The models count software as generated only when building it was itself a research contribution."),
      para("Both are defensible readings of criteria.md, which asks for “new or substantially extended software "
        + "that plays a substantial role… or is itself a research goal, and is shared or published”. The human "
        + "weights “new” and “shared”; the models weight “substantially extended” and “research goal”."),
    ]));
    caseCard.appendChild(el("div", {}, cases.map(caseRow)));
    caseCard.appendChild(commentary([
      para("The same ambiguity runs on the data axis: whether applying a new workflow to existing material creates a "
        + "dataset, or merely describes the material you already had."),
      para("It is worth saying plainly that the human is not automatically right. At least one of these cases reads "
        + "as the model applying the stated criteria better than the reviewer did — these are 30 papers on which a "
        + "second human reviewer would side with the model more than once."),
    ]));
  }
  cards.push(caseCard);
  return el("div", {}, cards);
}

/** One contested paper: the human's reasoning against the models'. */
function caseRow(c) {
  const key = "case:" + c.paper.pmid;
  const open = state.openReasons.has(key);
  const top = c.ranked[0];
  const head = el("button", { class: "jhead", type: "button", "aria-expanded": String(open), onclick: () => {
    open ? state.openReasons.delete(key) : state.openReasons.add(key);
    render();
  }}, [
    el("span", { class: "caret", text: open ? "▾" : "▸" }),
    el("span", { class: "case-verdict" }, [
      el("span", { class: "swatch", style: `background:${configColor(HUMAN_ID)}` }),
      codePill(c.human, { title: `human: ${categoryTitle(c.human)}` }),
      el("span", { class: "muted", text: "vs" }),
      codePill(top, { title: `models: ${categoryTitle(top)}` }),
      el("span", { class: "muted num", text: `${c.counts[top]}/${c.votes.length}` }),
    ]),
    el("span", { class: "snip", style: "color:var(--text-primary); white-space:normal", text: c.paper.title || c.paper.pmid }),
  ]);
  const kids = [head];
  if (open) {
    // The human, then one run per configuration — whichever backed that
    // configuration's most common answer for this paper.
    const picks = [];
    for (const id of activeConfigs().filter((x) => !isHuman(x))) {
      const inCfg = c.votes.filter((v) => v.run.config === id);
      if (!inCfg.length) continue;
      const tally = {};
      for (const v of inCfg) tally[v.cat] = (tally[v.cat] || 0) + 1;
      const best = Object.keys(tally).sort((a, b) => tally[b] - tally[a] || CATS.indexOf(a) - CATS.indexOf(b))[0];
      picks.push({ ...inCfg.find((v) => v.cat === best), n: tally[best], of: inCfg.length });
    }
    kids.push(el("div", { class: "case-body" }, [
      el("div", { class: "card-note", style: "margin-bottom:8px" }, [
        el("span", { text: `${c.paper.field || ""} · ${c.paper.year || ""} · the models spread over ` }),
        el("b", { text: c.ranked.map((r) => `${r} ×${c.counts[r]}`).join(", ") }),
      ]),
      c.humanRun ? quoteBlock(configLabel(HUMAN_ID), configColor(HUMAN_ID), c.human,
        (J_BY_PAPER.get(c.paper.pmid).get(c.humanRun.run_id) || {}).reasoning, c.humanRun.run_id) : null,
      ...picks.map((v) => quoteBlock(configLabel(v.run.config), configColor(v.run.config), v.cat,
        (J_BY_PAPER.get(c.paper.pmid).get(v.run.run_id) || {}).reasoning, v.run.run_id,
        `${v.n} of ${v.of} runs said ${v.cat}`)),
      el("button", { class: "btn", type: "button", style: "margin-top:4px",
        onclick: () => { state.paper = c.paper.pmid; state.tab = "papers"; render(); },
        text: "See every judgement on this paper →" }),
    ]));
  }
  return el("div", { class: "jrow" }, kids);
}

function quoteBlock(who, color, cat, text, runId, note) {
  return el("div", { class: "quote" }, [
    el("div", { class: "quote-head" }, [
      el("span", { class: "swatch", style: `background:${color}` }),
      el("span", { class: "nm", text: who }),
      codePill(cat),
      note ? el("span", { class: "muted", style: "font-size:11px", text: note }) : null,
      el("span", { class: "muted num", style: "font-size:11px; margin-left:auto", text: runId }),
    ]),
    el("blockquote", { class: "prose", text: text || "No reasoning recorded." }),
  ]);
}

/* ---------- view: runs ---------- */
function viewRuns() {
  const cards = CONFIG_IDS.filter((a) => RUNS_BY_CONFIG.get(a).length).map((a) => {
    const conf = cfgOf(a);
    return el("div", { style: "margin-bottom:22px" }, [

        el("span", { class: "swatch", style: `background:${configColor(a)}` }),
        el("h2", { text: configLabel(a) }),
        el("span", { class: "muted", style: "font-size:12px", text: conf.blurb }),
      ]),
      el("div", { class: "grid2" }, RUNS_BY_CONFIG.get(a).map(runCard)),
    ]);
  });
  cards.push(el("div", { class: "card" }, [
    el("h2", { text: "Prompt inputs" }),
    el("div", { class: "card-note", text: "Every run in this set used the same task and criteria files (identical SHAs above)." }),
    el("details", { class: "raw" }, [el("summary", { text: "task.md" }), el("pre", { text: DATA.task_md })]),

function runCard(r) {
  const js = J_BY_RUN.get(r.run_id) || [];
  const t = tally(js);
  const on = state.runs.has(r.run_id);
  const totalTokens = js.reduce((a, j) => a + (j.prompt_tokens || 0) + (j.output_tokens || 0), 0);
  const totalDur = js.reduce((a, j) => a + (j.duration_s || 0), 0);
  const m = r.meta;
  const topCat = CATS.reduce((a, c) => t.counts[c] > t.counts[a] ? c : a, CATS[0]);

  const kv = [];
  const add = (k, v) => { if (v !== null && v !== undefined && v !== "") kv.push([k, String(v)]); };
  add("Run id", r.run_id);
  add("Name", r.name);
  add("Provider", m.provider);
  add("Model", m.model || "—");
  add("Input", m.content === "metadata" ? "metadata (title + abstract)" : m.content);
  add("Started", m.started_at);
  add("Finished", m.finished_at);
  if (m.started_at && m.finished_at) {
    const mins = (new Date(m.finished_at) - new Date(m.started_at)) / 60000;
    add("Wall clock", `${mins.toFixed(1)} min`);
  }
  add("Host", m.host);
  add("Context window", m.num_ctx ? fmtNum(m.num_ctx) : null);
  add("Timeout", m.timeout_s ? `${m.timeout_s}s` : null);
  add("Papers", `${m.num_papers_classified} classified / ${m.num_papers_total} total`);
  if (totalTokens) add("Tokens", `${fmtNum(totalTokens)} (${fmtNum(js.reduce((a, j) => a + (j.prompt_tokens || 0), 0))} in)`);
  if (totalDur) add("Model time", `${(totalDur / 60).toFixed(1)} min · ${(totalDur / js.length).toFixed(1)}s per paper`);
  add("Results file", r.results_file);
  add("criteria.md", r.criteria_sha);
  add("task.md", r.task_sha);
  if (t.missing) add("Unclassified rows", t.missing);

  const strip = el("div", { class: "strip" }, CATS.filter((c) => t.counts[c] > 0).map((c) =>
    hoverable(el("div", { tabindex: "0", style: `flex:${t.counts[c]}; background:${configColor(r.config)}` }),
      () => [el("div", { class: "tl", text: `${c} — ${categoryTitle(c)}` }), tipLine("judgements", String(t.counts[c]))])));

  return el("div", { class: "run-card" }, [
    el("div", { class: "hd" }, [
      el("span", { class: "swatch", style: `background:${configColor(r.config)}` }),
      el("h3", { text: r.name }),
      el("button", { class: "btn", type: "button", style: "margin-left:auto", "aria-pressed": String(on),
        onclick: () => { on ? state.runs.delete(r.run_id) : state.runs.add(r.run_id); render(); },
        text: on ? "In view" : "Add to view" }),
    ]),
    el("div", { class: "muted", style: "font-size:12px", text: r.run_id }),
    strip,
    el("div", { class: "muted", style: "font-size:11px; margin-top:5px",
      text: `category mix across ${js.length} papers — widest segment is ${topCat}` }),
    el("dl", { class: "kv" }, kv.flatMap(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })])),
    el("details", { class: "raw" }, [
      el("summary", { text: "raw run.json" }),
      el("pre", { text: JSON.stringify(m, null, 2) }),
    ]),
    el("details", { class: "raw" }, [
      el("summary", { text: `result fields (${r.fields.length})` }),
      el("pre", { text: r.fields.join("\n") }),
    ]),
  ]);
}

/* ---------- chrome ---------- */
const TABS = [
  { id: "overview", label: "Overview", view: viewOverview },
  { id: "papers", label: "Papers", view: viewPapers },
  { id: "variation", label: "Variation", view: viewVariation },
  { id: "consensus", label: "Consensus vs human", view: viewConsensus },
  { id: "reasoning", label: "Reasoning", view: viewReasoning },
  { id: "runs", label: "Runs", view: viewRuns },
];

function renderFilters() {
  const holder = clear(document.getElementById("config-rows"));
  for (const id of CONFIG_IDS) {
    const runs = RUNS_BY_CONFIG.get(id);
    if (!runs.length) continue;
    const nOn = runs.filter((r) => state.runs.has(r.run_id)).length;
    const all = nOn === runs.length, none = nOn === 0;
    holder.appendChild(hoverable(el("button", {
      class: `config-toggle c${configSlot(id)}`, type: "button",
      "aria-pressed": String(!none),
      "data-partial": String(!all && !none),
      onclick: () => {
        // A configuration is all-or-nothing here; per-run control lives on the Runs tab.
        runs.forEach((r) => all ? state.runs.delete(r.run_id) : state.runs.add(r.run_id));
        render();
      },
    }, [
      el("span", { class: "swatch", style: `background:${configColor(id)}` }),
      el("span", { style: "min-width:0" }, [
        el("span", { class: "nm", text: configLabel(id) }),
        el("span", { class: "bl", text: all || none
          ? `${runs.length} run${runs.length === 1 ? "" : "s"}`
          : `${nOn} of ${runs.length} runs — trimmed on the Runs tab` }),
      ]),
    ]), () => configToggleTip(id, runs, nOn)));
  }
  document.getElementById("sel-count").textContent =
    `${activeConfigs().length} of ${CONFIGS.length} configurations · ${state.runs.size} runs · ${DATA.papers.length} papers`;
}

/** Hover card for a configuration toggle. */
function configToggleTip(id, runs, nOn) {
  const c = cfgOf(id), m = (RUN_BY_ID.get(runs[0].run_id) || {}).meta || {};
  const lines = [el("div", { class: "tv", text: c.label }), el("div", { class: "tl", text: c.blurb })];
  const add = (k, v) => { if (v) lines.push(el("div", { class: "tl", text: `${k}: ${v}` })); };
  add("model", m.model || "human reviewer");
  add("provider", m.provider);
  add("repeats", `${runs.length} run${runs.length === 1 ? "" : "s"}`);
  const js = runs.flatMap((r) => J_BY_RUN.get(r.run_id) || []);
  const tokens = js.reduce((a, j) => a + (j.prompt_tokens || 0) + (j.output_tokens || 0), 0);
  if (tokens) add("tokens", fmtNum(tokens));
  lines.push(el("div", { class: "tl", style: "margin-top:5px; color:var(--text-muted)",
    text: nOn === runs.length ? "click to remove from view" : "click to add to view" }));
  return lines;
}

function renderTabs() {
  const nav = clear(document.getElementById("tabs"));
  for (const t of TABS) {
    nav.appendChild(el("button", {
      type: "button", role: "tab", "aria-selected": String(state.tab === t.id),
      onclick: () => { state.tab = t.id; render(); }, text: t.label,
    }));
  }
}

function render() {
  hideTip();
  renderFilters();
  renderTabs();
  const view = clear(document.getElementById("view"));
  const tab = TABS.find((t) => t.id === state.tab) || TABS[0];
  const out = tab.view();
  [].concat(out).forEach((n) => view.appendChild(n));
}

/* presets */
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
  const p = b.dataset.preset;
  if (p === "all") state.runs = new Set(DATA.runs.map((r) => r.run_id));
  else if (p === "none") state.runs = new Set();
  else if (p === "models") state.runs = new Set(DATA.runs.filter((r) => !isHuman(r.config)).map((r) => r.run_id));
  render();
}));

/* theme */
const themeBtn = document.getElementById("theme-btn");
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try { next ? localStorage.setItem("pif-theme", next) : localStorage.removeItem("pif-theme"); } catch (e) {}
  themeBtn.textContent = next ? (next === "dark" ? "Dark" : "Light") : "Theme";
  render();
});
try {
  const saved = localStorage.getItem("pif-theme");
  if (saved) { document.documentElement.setAttribute("data-theme", saved); themeBtn.textContent = saved === "dark" ? "Dark" : "Light"; }
} catch (e) {}

document.getElementById("hdr-sub").textContent =
  `${CONFIGS.length} configurations · ${DATA.runs.length} runs · ${DATA.papers.length} papers`
  + ` · built ${DATA.generated_at.slice(0, 16).replace("T", " ")} UTC`;

render();
</script>
</body>
</html>
