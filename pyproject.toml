[project]
name = "pif"
version = "0.1.0"
description = "Paying It Forward: classify research papers by the software and data they generate or use, and compare reviewers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # running experiments
    "requests>=2.32",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    # loading results, dashboard, analysis
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.9",
]

[project.scripts]
pif = "pif.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pif"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
